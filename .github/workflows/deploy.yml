name: Spring Boot CI/CD to Oracle Cloud

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 17 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: Spring Boot 빌드 (테스트 제외)
        run: ./gradlew clean build -x test

      - name: 빌드된 JAR 파일을 오라클 서버로 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "/home/opc/app"
          strip_components: 2

      - name: 오라클 서버에서 기존 앱 종료 후 새 앱 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/opc/app 
            
            # 1. 기존 실행 중인 자바 프로세스 종료
            sudo pkill -9 -f 'java -jar' || true
            sleep 3
            
            # 2. plain.jar 제외 및 최신 JAR 파일명 가져오기 
            JAR_NAME=$(ls -t *.jar | grep -v 'plain' | head -n 1)
            echo "배포할 JAR 파일: $JAR_NAME"
            
            # 3. 이전 백업 jar 정리 (최신 1개만 남기고 삭제)
            ls -t *.jar | grep -v "$JAR_NAME" | xargs rm -f || true
            
            # 4. 메모리 옵션 적용하여 백그라운드 실행
            nohup java -Xms128m -Xmx256m -XX:+UseSerialGC -Xss256k -jar $JAR_NAME > app.log 2>&1 &
            
            # 5. 구동 확인
            sleep 5
            if pgrep -f 'java -jar' > /dev/null
            then
              echo "Application started successfully!"
              exit 0
            else
              echo "Application failed to start. Check app.log below:"
              cat app.log
              exit 1
            fi
