name: Spring Boot CI/CD to Oracle Cloud

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 17 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: Spring Boot 빌드 (테스트 제외)
        run: ./gradlew clean build -x test

      - name: 빌드된 JAR 파일을 오라클 서버로 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "/home/opc/app"
          strip_components: 2

      - name: 오라클 서버에서 기존 앱 종료 후 새 앱 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/opc/app 
            
            sudo pkill -9 -f 'java -jar' || true
            
            sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches
            
            sleep 10
            
            echo "새 애플리케이션 배포 시작"
            nohup java -Xmx512m -Xms512m -jar *SNAPSHOT.jar > app.log 2>&1 &
            
            sleep 2
            ps -ef | grep java